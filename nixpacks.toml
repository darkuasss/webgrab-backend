[phases.setup]
# Hier sagen wir Railway, dass wir den PDF-Drucker brauchen
nixPkgs = ["wkhtmltopdf"]

[phases.build]
# Hier zwingen wir Railway, den Playwright-Browser und alle System-Abhängigkeiten zu installieren
cmds = [
    "pip install -r requirements.txt",
    "playwright install chromium --with-deps"
]
